# AI-Q Helm Values - vLLM + RAG Blueprint Configuration
#
# This configuration uses:
# - Locally-hosted vLLM models for all LLM inference (AI-Q agents)
# - External NVIDIA RAG Blueprint for knowledge retrieval
#
# Prerequisites:
# - vLLM server(s) running and accessible from the cluster
# - Models loaded:
#   - RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8 (intent & researcher)
#   - RedHatAI/gpt-oss-120b (orchestrator)
#   - nvidia/Nemotron-Mini-4B-Instruct (summary)
# - NVIDIA RAG Blueprint deployed and accessible
# - Know your RAG server URLs (query and ingestion endpoints)
#
# Usage:
#   helm upgrade --install aiq deployment-k8s/ -n ns-aiq \
#     -f values-vllm-frag.yaml \
#     --set aiq.apps.backend.env.VLLM_BASE_URL=http://your-vllm-server:8000 \
#     --set aiq.apps.backend.env.RAG_SERVER_URL=http://rag-server.rag-ns.svc.cluster.local:8081/v1 \
#     --set aiq.apps.backend.env.RAG_INGEST_URL=http://ingestor-server.rag-ns.svc.cluster.local:8082/v1

aiq:
  apps:
    backend:
      env:
        CONFIG_FILE: /app/configs-custom/config_web_vllm_frag.yml

        # vLLM endpoints - when using vllm-models chart, these point to separate InferenceServices
        # Intent & Researcher use the same model, so share the same endpoint
        VLLM_BASE_URL: http://nemotron-nano-30b-predictor.ns-aiq.svc.cluster.local:8080
        VLLM_ORCHESTRATOR_BASE_URL: http://gpt-oss-120b-predictor.ns-aiq.svc.cluster.local:8080
        VLLM_SUMMARY_BASE_URL: http://nemotron-mini-4b-predictor.ns-aiq.svc.cluster.local:8080
        VLLM_API_KEY: no-key  # vLLM servers don't require auth by default

        # Model names (should match servedModelName in vllm-models chart)
        # VLLM_INTENT_MODEL: RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
        # VLLM_RESEARCHER_MODEL: RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
        # VLLM_ORCHESTRATOR_MODEL: RedHatAI/gpt-oss-120b
        # VLLM_SUMMARY_MODEL: nvidia/Nemotron-Mini-4B-Instruct

        # GPU-constrained alternative: swap gpt-oss-120b for llama-3-3-70b-fp8 in vllm-models chart
        # VLLM_ORCHESTRATOR_MODEL: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
        # VLLM_ORCHESTRATOR_BASE_URL: http://llama-3-3-70b-fp8-predictor.ns-aiq.svc.cluster.local:8080

        # REQUIRED: RAG Blueprint endpoints
        # If RAG is in the same cluster, use internal service DNS:
        # http://rag-server.<rag-namespace>.svc.cluster.local:8081/v1
        RAG_SERVER_URL: http://rag-server.rag.svc.cluster.local:8081/v1
        RAG_INGEST_URL: http://ingestor-server.rag.svc.cluster.local:8082/v1

        # Optional: Collection name for document storage
        # COLLECTION_NAME: default_collection

      # Mount custom vLLM+RAG config file and data storage
      volumeMounts:
      - name: vllm-frag-config
        mountPath: /app/configs-custom
        readOnly: true
      - name: data-storage
        mountPath: /app/data

      volumes:
      - name: postgres-init
        configMap:
          name: aiq-postgres-init
      - name: vllm-frag-config
        configMap:
          name: aiq-vllm-frag-config
      - name: data-storage
        emptyDir: {}

      # Create ConfigMap with vLLM+RAG config file
      configMaps:
      - name: aiq-vllm-frag-config
        data:
          config_web_vllm_frag.yml: |
            general:
              use_uvloop: true
              telemetry:
                logging:
                  console:
                    _type: console
                    level: INFO
              front_end:
                _type: aiq_api
                runner_class: aiq_api.plugin.AIQAPIWorker
                db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
                expiry_seconds: 86400
                cors:
                  allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
                  allow_methods:
                    - GET
                    - POST
                    - DELETE
                    - OPTIONS
                  allow_headers:
                    - "*"
                  allow_credentials: true
                  expose_headers:
                    - "*"
            llms:
              intent_llm:
                _type: openai
                model_name: ${VLLM_INTENT_MODEL:-RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8}
                base_url: ${VLLM_INTENT_BASE_URL:-${VLLM_BASE_URL:-http://localhost:8000}}/v1
                api_key: ${VLLM_API_KEY}
                temperature: 0.5
                top_p: 0.9
                max_tokens: 4096
              researcher_llm:
                _type: openai
                model_name: ${VLLM_RESEARCHER_MODEL:-RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8}
                base_url: ${VLLM_BASE_URL:-http://localhost:8000}/v1
                api_key: ${VLLM_API_KEY}
                temperature: 0.1
                top_p: 0.3
                max_tokens: 16384
              orchestrator_llm:
                _type: openai
                model_name: ${VLLM_ORCHESTRATOR_MODEL:-RedHatAI/gpt-oss-120b}
                base_url: ${VLLM_ORCHESTRATOR_BASE_URL:-${VLLM_BASE_URL:-http://localhost:8000}}/v1
                api_key: ${VLLM_API_KEY}
                temperature: 1.0
                top_p: 1.0
                max_tokens: 65536
              summary_llm:
                _type: openai
                model_name: ${VLLM_SUMMARY_MODEL:-nvidia/Nemotron-Mini-4B-Instruct}
                base_url: ${VLLM_SUMMARY_BASE_URL:-${VLLM_BASE_URL:-http://localhost:8000}}/v1
                api_key: ${VLLM_API_KEY}
                temperature: 0.3
                max_tokens: 100
            functions:
              web_search_tool:
                _type: tavily_web_search
                max_results: 5
                max_content_length: 1000
              advanced_web_search_tool:
                _type: tavily_web_search
                max_results: 2
                advanced_search: true
              paper_search_tool:
                _type: paper_search
                max_results: 5
                serper_api_key: ${SERPER_API_KEY}
              knowledge_search:
                _type: knowledge_retrieval
                backend: foundational_rag
                collection_name: ${COLLECTION_NAME:-default_collection}
                summary_db: ${AIQ_SUMMARY_DB:-postgresql+asyncpg://postgres:postgres@aiq-postgres:5432/aiq_jobs}
                top_k: 5
                rag_url: ${RAG_SERVER_URL:-http://rag-server.rag.svc.cluster.local:8081/v1}
                ingest_url: ${RAG_INGEST_URL:-http://ingestor-server.rag.svc.cluster.local:8082/v1}
                timeout: 300
              intent_classifier:
                _type: intent_classifier
                llm: intent_llm
                verbose: true
                tools:
                  - web_search_tool
                  - paper_search_tool
                  - knowledge_search
              clarifier_agent:
                _type: clarifier_agent
                llm: researcher_llm
                planner_llm: researcher_llm
                tools:
                  - web_search_tool
                  - paper_search_tool
                  - knowledge_search
                max_turns: 3
                enable_plan_approval: true
                log_response_max_chars: 2000
                verbose: true
              shallow_research_agent:
                _type: shallow_research_agent
                llm: researcher_llm
                verbose: true
                tools:
                  - web_search_tool
                  - paper_search_tool
                  - knowledge_search
                max_llm_turns: 10
                max_tool_iterations: 5
              deep_research_agent:
                _type: deep_research_agent
                orchestrator_llm: orchestrator_llm
                researcher_llm: researcher_llm
                planner_llm: orchestrator_llm
                max_loops: 2
                verbose: true
                tools:
                  - paper_search_tool
                  - advanced_web_search_tool
                  - knowledge_search
            workflow:
              _type: chat_deepresearcher_agent
              verbose: true
              enable_escalation: true
              enable_clarifier: true
              use_async_deep_research: true
              checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}

      # imagePullSecrets:
      #   - name: ngc-api

    frontend:
      env:
        VLLM_API_KEY: no-key
      # imagePullSecrets:
      #   - name: ngc-api
