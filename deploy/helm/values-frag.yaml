# AI-Q Helm Values - NGC + Foundational RAG Configuration
#
# This configuration uses:
# - NGC API models for all LLM inference (AI-Q agents)
# - External NVIDIA RAG Blueprint for knowledge retrieval
#
# Prerequisites:
# - NVIDIA API key (for NGC models)
# - NVIDIA RAG Blueprint deployed and accessible
# - Know your RAG server URLs (query and ingestion endpoints)
#
# Usage:
#   helm upgrade --install aiq deployment-k8s/ -n ns-aiq \
#     -f values-frag.yaml

aiq:
  apps:
    backend:
      env:
        CONFIG_FILE: /app/configs-custom/config_web_frag.yml

        # REQUIRED: Update these to your RAG Blueprint endpoints
        # If RAG is in the same cluster, use internal service DNS:
        # http://rag-server.<rag-namespace>.svc.cluster.local:8081/v1
        RAG_SERVER_URL: http://rag-server.rag.svc.cluster.local:8081/v1
        RAG_INGEST_URL: http://ingestor-server.rag.svc.cluster.local:8082/v1

        # Optional: Collection name for document storage
        # COLLECTION_NAME: default_collection

      # Mount custom NGC+RAG config file and data storage
      volumeMounts:
      - name: frag-config
        mountPath: /app/configs-custom
        readOnly: true
      - name: data-storage
        mountPath: /app/data

      volumes:
      - name: postgres-init
        configMap:
          name: aiq-postgres-init
      - name: frag-config
        configMap:
          name: aiq-frag-config
      - name: data-storage
        emptyDir: {}

      # Create ConfigMap with NGC+RAG config file
      configMaps:
      - name: aiq-frag-config
        data:
          config_web_frag.yml: |
            general:
              use_uvloop: true
              telemetry:
                logging:
                  console:
                    _type: console
                    level: INFO
              front_end:
                _type: aiq_api
                runner_class: aiq_api.plugin.AIQAPIWorker
                db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
                expiry_seconds: 86400
                cors:
                  allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
                  allow_methods:
                    - GET
                    - POST
                    - DELETE
                    - OPTIONS
                  allow_headers:
                    - "*"
                  allow_credentials: true
                  expose_headers:
                    - "*"
            llms:
              nemotron_llm_intent:
                _type: nim
                model_name: nvidia/nemotron-3-nano-30b-a3b
                base_url: "https://integrate.api.nvidia.com/v1"
                temperature: 0.5
                top_p: 0.9
                max_tokens: 4096
                num_retries: 5
                chat_template_kwargs:
                  enable_thinking: true
              nemotron_nano_llm:
                _type: nim
                model_name: nvidia/nemotron-3-nano-30b-a3b
                base_url: "https://integrate.api.nvidia.com/v1"
                temperature: 0.1
                top_p: 0.3
                max_tokens: 16384
                num_retries: 5
                chat_template_kwargs:
                  enable_thinking: true
              gpt_oss_llm:
                _type: nim
                model_name: openai/gpt-oss-120b
                base_url: https://integrate.api.nvidia.com/v1
                temperature: 1.0
                top_p: 1.0
                max_tokens: 256000
                api_key: ${NVIDIA_API_KEY}
                max_retries: 10
            functions:
              web_search_tool:
                _type: tavily_web_search
                max_results: 5
                max_content_length: 1000
              advanced_web_search_tool:
                _type: tavily_web_search
                max_results: 2
                advanced_search: true
              knowledge_search:
                _type: knowledge_retrieval
                backend: foundational_rag
                collection_name: ${COLLECTION_NAME:-default_collection}
                summary_db: ${AIQ_SUMMARY_DB:-postgresql+asyncpg://postgres:postgres@aiq-postgres:5432/aiq_jobs}
                top_k: 5
                rag_url: ${RAG_SERVER_URL:-http://rag-server.rag.svc.cluster.local:8081/v1}
                ingest_url: ${RAG_INGEST_URL:-http://ingestor-server.rag.svc.cluster.local:8082/v1}
                timeout: 300
              paper_search_tool:
                _type: paper_search
                max_results: 5
                serper_api_key: ${SERPER_API_KEY}
              intent_classifier:
                _type: intent_classifier
                llm: nemotron_llm_intent
                tools:
                  - web_search_tool
                  - paper_search_tool
                  - knowledge_search
              clarifier_agent:
                _type: clarifier_agent
                llm: nemotron_nano_llm
                planner_llm: nemotron_nano_llm
                tools:
                  - web_search_tool
                  - paper_search_tool
                  - knowledge_search
                max_turns: 3
                enable_plan_approval: true
                log_response_max_chars: 2000
                verbose: true
              shallow_research_agent:
                _type: shallow_research_agent
                llm: nemotron_nano_llm
                tools:
                  - web_search_tool
                  - paper_search_tool
                  - knowledge_search
                max_llm_turns: 10
                max_tool_iterations: 5
              deep_research_agent:
                _type: deep_research_agent
                orchestrator_llm: gpt_oss_llm
                researcher_llm: nemotron_nano_llm
                planner_llm: gpt_oss_llm
                max_loops: 2
                tools:
                  - paper_search_tool
                  - advanced_web_search_tool
                  - knowledge_search
            workflow:
              _type: chat_deepresearcher_agent
              enable_escalation: true
              enable_clarifier: true
              use_async_deep_research: true
              checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}

      imagePullSecrets:
        - name: ngc-api

    frontend:
      imagePullSecrets:
        - name: ngc-api
