{{- $root := . }}
{{- range $name, $model := .Values.models }}
{{- if $model.enabled }}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.namespace }}
  labels:
    app: vllm
    model: {{ $name }}
    chart: {{ $root.Chart.Name }}-{{ $root.Chart.Version }}
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    # KServe doesn't roll predictors when the ServingRuntime changes; this
    # fingerprint makes a runtime change re-reconcile every InferenceService.
    vllm-models/runtime-hash: {{ include (print $root.Template.BasePath "/servingruntime.yaml") $root | sha256sum | trunc 16 | quote }}
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    # Each pod needs a whole GPU and each GPU node has one: a rolling update would
    # wait forever for a GPU the old pod still holds. Stop the old pod first.
    deploymentStrategy:
      type: Recreate
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-runtime
      storageUri: {{ $model.modelUri }}
      name: ''
      args:
        - --served-model-name={{ $model.servedModelName }}
        {{- if $model.vllmArgs }}
        {{- range $model.vllmArgs }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
      resources:
        limits:
          {{- toYaml $model.resources.limits | nindent 10 }}
        requests:
          {{- toYaml $model.resources.requests | nindent 10 }}
      {{- if $model.nodeSelector }}
      nodeSelector:
        {{- toYaml $model.nodeSelector | nindent 8 }}
      {{- end }}
    {{- if $model.tolerations }}
    tolerations:
      {{- toYaml $model.tolerations | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
