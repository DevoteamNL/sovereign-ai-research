apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  namespace: {{ .Values.global.namespace }}
  labels:
    app: vllm
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  supportedModelFormats:
    - name: vllm
      version: "1"
      autoSelect: true

  containers:
    - name: kserve-container
      image: {{ .Values.runtime.image }}
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        {{- range .Values.runtime.args }}
        - {{ . | quote }}
        {{- end }}
        - --model=$(STORAGE_URI)
        - --port=8080
        - --served-model-name=$(SERVED_MODEL_NAME)

      env:
        {{- if or .Values.huggingfaceToken.existingSecret .Values.huggingfaceToken.value }}
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              {{- if .Values.huggingfaceToken.existingSecret }}
              name: {{ .Values.huggingfaceToken.existingSecret }}
              key: {{ .Values.huggingfaceToken.existingSecretKey }}
              {{- else }}
              name: huggingface-token
              key: token
              {{- end }}
        {{- end }}

      ports:
        - containerPort: 8080
          protocol: TCP
          name: http

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 120
        periodSeconds: 30
        timeoutSeconds: 10

      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10

  protocolVersions:
    - v1
    - v2
