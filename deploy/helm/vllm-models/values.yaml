# vLLM Models Helm Chart Values
# Deploys vLLM inference servers via KServe for AI-Q

# Global settings
global:
  namespace: ns-aiq

# vLLM ServingRuntime configuration
runtime:
  image: registry.redhat.io/rhaii-early-access/vllm-cuda-rhel9
  tag: 3.4.0-ea.2
  shmSize: 2Gi  # Shared memory size for vLLM

# ==============================================================================
# MIG Configuration Guide
# ==============================================================================
# If using MIG (Multi-Instance GPU), check your available profiles with:
#   kubectl describe node <gpu-node> | grep "nvidia.com/mig"
#
# Model VRAM requirements (approximate):
#   nemotron-nano-30b (FP8): ~25-30GB
#   granite-embedding-english-r2: ~1GB
#   llama-3-3-70b-fp8: ~35-40GB
#
# Select MIG slices that provide enough VRAM for each model. Examples below
# use specific profiles corresponding to H100 GPUs - adjust to match your cluster's MIG configuration.
# ==============================================================================

# Model deployments
models:
  # Orchestrator model - RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
  #
  # Same model as the researcher below, but deployed as its own InferenceService
  # on its own GPU so orchestrator requests don't queue behind the researcher's
  # concurrent calls (deep_researcher runs up to 6 in parallel).
  #
  # A 30B model is modest for multi-turn agentic orchestration - validate
  # orchestration quality before relying on it.
  nemotron-nano-30b-orchestrator:
    enabled: true
    modelUri: oci://registry.redhat.io/rhai/modelcar-nvidia-nemotron-3-nano-30b-a3b-fp8:3.0
    servedModelName: RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8

    # Full GPU (L40S 48GB; FP8 weights ~25-30GB leaves KV cache headroom)
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: 24Gi
        cpu: "4"
      requests:
        nvidia.com/gpu: "1"
        memory: 16Gi
        cpu: "2"

    vllmArgs:
      - --enable-force-include-usage
      - --max-model-len=131072
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --trust-remote-code
      - --reasoning-parser-plugin=/mnt/models/nano_v3_reasoning_parser.py
      - --reasoning-parser=nano_v3

    nodeSelector: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

  # Intent, researcher & summary model - RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
  # One vLLM instance serves all three roles (continuous batching); verified
  # under load: intent/summary ~2s while 6 parallel research calls run.
  nemotron-nano-30b-intent-researcher-summary:
    enabled: true
    # Switched from quay.io/jharmison (personal namespace, no support
    # guarantee) to the official Red Hat ModelCar. Same model, verified
    # pullable on RHDP clusters.
    modelUri: oci://registry.redhat.io/rhai/modelcar-nvidia-nemotron-3-nano-30b-a3b-fp8:3.0
    servedModelName: RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8

    # Option 1: Full GPU (A100 40GB+ or any H100)
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: 24Gi
        cpu: "4"
      requests:
        nvidia.com/gpu: "1"
        memory: 16Gi
        cpu: "2"

    # Option 2: H100 MIG (1x 3g.47gb slice - 47GB VRAM)
    # Uncomment and comment out Option 1 to use MIG
    # resources:
    #   limits:
    #     nvidia.com/mig-3g.47gb: "1"
    #     memory: 32Gi
    #     cpu: "4"
    #   requests:
    #     nvidia.com/mig-3g.47gb: "1"
    #     memory: 24Gi
    #     cpu: "2"

    vllmArgs:
      - --enable-force-include-usage
      - --max-model-len=131072
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --trust-remote-code
      - --reasoning-parser-plugin=/mnt/models/nano_v3_reasoning_parser.py
      - --reasoning-parser=nano_v3
      # For MIG add: --gpu-memory-utilization=0.85

    nodeSelector: {}
      # For MIG: nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    # Required: GPU nodes are tainted nvidia.com/gpu=true:NoSchedule
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

  # Embedding model - ibm-granite/granite-embedding-english-r2
  #
  # Used by the knowledge layer (AIQ_EMBED_*) to index uploaded documents and
  # embed search queries. Without it the app falls back to NVIDIA's hosted
  # embedding API. Needs an 8192-token context (app chunks are 1024 tokens)
  # and no query/passage prefixes (the app's NVIDIA client doesn't add them).
  # English-only.
  granite-embedding-english-r2-embedding:
    enabled: true
    modelUri: oci://registry.redhat.io/rhai/modelcar-granite-embedding-english-r2:3.0
    servedModelName: ibm-granite/granite-embedding-english-r2

    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: "8Gi"
        cpu: "2"
      requests:
        nvidia.com/gpu: "1"
        memory: "4Gi"
        cpu: "1"

    vllmArgs:
      - --runner=pooling
      - --max-model-len=8192

    nodeSelector: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

# Optional: larger alternative for the orchestrator role
# Enable this instead of the nano-30b orchestrator above if you have more GPU memory
  # llama-3-3-70b-fp8:
  #   enabled: false
  #   modelUri: hf://RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
  #   servedModelName: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
  #
  #   # Option 1: Full GPU (A100 40GB or H100)
  #   resources:
  #     limits:
  #       nvidia.com/gpu: "1"  # ~35-40GB VRAM
  #     requests:
  #       nvidia.com/gpu: "1"
  #       memory: "48Gi"
  #       cpu: "4"
  #   vllmArgs:
  #     - --tensor-parallel-size=1
  #     - --max-model-len=8192
  #
  #   # Option 2: H100 MIG (1x 3g.47gb slice - 47GB VRAM)
  #   # resources:
  #   #   limits:
  #   #     nvidia.com/mig-3g.47gb: "1"
  #   #     memory: 48Gi
  #   #     cpu: "4"
  #   #   requests:
  #   #     nvidia.com/mig-3g.47gb: "1"
  #   #     memory: 40Gi
  #   #     cpu: "2"
  #   # vllmArgs:
  #   #   - --tensor-parallel-size=1
  #   #   - --max-model-len=8192
  #   #   - --gpu-memory-utilization=0.9
  #
  #   nodeSelector: {}
  #     # For MIG: nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
  #   tolerations: []

# Service configuration
service:
  type: ClusterIP
  annotations: {}
