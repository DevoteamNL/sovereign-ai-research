{{- if .Values.apps.backend.enabled }}
{{- $backendSA := .Values.apps.backend.serviceAccount | default dict }}
{{- $createSA := $backendSA.create | default false }}
{{- if $createSA }}
---
# Long-lived token secret for the backend service account
# This secret will be automatically populated by Kubernetes with a token
# that can be used for MLflow authentication
#
# To extract the token after deployment:
#   kubectl get secret aiq-backend-token -n <namespace> -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: long-lived-api-token
  namespace: {{ include "aiq.namespace" . }}
  labels:
    {{- include "aiq.labels" . | nindent 4 }}
    component: mlflow-tracing
  annotations:
    kubernetes.io/service-account.name: {{ include "aiq.appFullname" (list . "backend") }}
    description: "Long-lived token for AI-Q backend app service account"
type: kubernetes.io/service-account-token
{{- end }}
{{- end }}
