{{- if .Values.apps.backend.enabled }}
{{- $backendSA := .Values.apps.backend.serviceAccount | default dict }}
{{- $createSA := $backendSA.create | default false }}
{{- if $createSA }}
---
# ClusterRoleBinding to grant the backend service account access to MLflow
#
# MLflow resources (mlflows.mlflow.opendatahub.io) are cluster-scoped in OpenDataHub/RHOAI,
# so a ClusterRoleBinding is required instead of a namespace-scoped RoleBinding.
#
# This binding grants the aiq-backend service account the same permissions as the
# mlflow-sa service account by referencing the 'mlflow' ClusterRole created by the
# MLflow operator.
#
# Required for:
# - Authenticating with MLflow's kube-rbac-proxy
# - Sending OTEL traces to MLflow tracking server
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aiq.appFullname" (list . "backend") }}-mlflow-access
  labels:
    {{- include "aiq.labels" . | nindent 4 }}
    component: mlflow-tracing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow
subjects:
- kind: ServiceAccount
  name: {{ include "aiq.appFullname" (list . "backend") }}
  namespace: {{ include "aiq.namespace" . }}
{{- end }}
{{- end }}
