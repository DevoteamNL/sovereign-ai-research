# Red Hat Branding Configuration for AI-Q
#
# This file contains UI branding customizations via runtime configuration.
# It can be overlaid on top of any base values file using multiple -f flags.
#
# Usage:
#   helm upgrade --install aiq aiq-rh/ -n ns-aiq \
#     -f aiq-rh/values-vllm.yaml \
#     -f aiq-rh/values-branding.yaml
#
# All branding settings are loaded at runtime from branding.json and default
# to NVIDIA AI-Q branding when not specified. No container image rebuild needed.

apps:
  frontend:
    # Mount Red Hat branding assets at runtime (no image rebuild needed)
    volumeMounts:
      - name: rh-branding
        mountPath: /app/public/branding
        readOnly: true

    volumes:
      - name: rh-branding
        configMap:
          name: rh-branding-assets

    env:
      # Browser tab metadata (used in layout.tsx)
      NEXT_PUBLIC_APP_TITLE: "Red Hat Research"
      NEXT_PUBLIC_APP_DESCRIPTION: "Red Hat AI-powered research assistant"
      NEXT_PUBLIC_FAVICON_PATH: "/branding/favicon.svg"

    # ConfigMaps for runtime branding assets (favicon + config)
    configMaps:
      - name: rh-branding-assets
        data:
          favicon.svg: |
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
              <rect width="64" height="64" rx="12" fill="#EE0000"/>
              <text x="32" y="45" text-anchor="middle" font-family="Red Hat Display, sans-serif" font-weight="700" font-size="38" fill="white">RH</text>
            </svg>

          branding.json: |
            {
              "appTitle": "Red Hat Research",
              "appDescription": "Red Hat AI-powered research assistant",
              "brandName": "Red Hat Research",
              "brandColor": "#EE0000",
              "docsUrl": "https://www.redhat.com/en/blog/introducing-ai-quickstarts",
              "signinButtonClass": "bg-[#EE0000] hover:bg-[#CC0000]",
              "logoViewBox": "0 0 40 40",
              "logoSvgPath": "M5 5 L35 5 L35 35 L5 35 Z",
              "fontsUrl": "https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap"
            }

# Notes:
# - Branding is loaded from /branding/branding.json at runtime (see ConfigMap below)
# - Changes take effect immediately on pod restart (no image rebuild needed)
# - All branding settings in branding.json are optional - omit any to use NVIDIA defaults
# - Favicon is served from /branding/favicon.svg (mounted via ConfigMap)
# - See frontends/ui/src/shared/hooks/useBranding.ts in patch 0002 for field documentation
# - See docs/advanced-docs/customization-reference.md for detailed deployment guide
