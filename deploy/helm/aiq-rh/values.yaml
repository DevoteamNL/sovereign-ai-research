# Generated WEB mode deployment

appname: aiq
project:
  name: aiq
  deploymentEnv: ''
  cluster_name: in-cluster
  cloud_provider: kind
  primary_owner: developer@localhost
  secondary_owner: developer@localhost
  blueprint_type: web
  deploymentTarget: kubernetes
  orientation: external
  profile: web
  services:
  - backend
  - frontend
  - postgres
  - rag
sharedSecrets:
  enabled: true
  autoMount: true
  refreshInterval: 5m
  dataFrom: []
apps:
  backend:
    enabled: true
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    image:
      repository: quay.io/tasmith/aiq-backend-redhat
      tag: "v2.1.0-nv"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ngc-api
    service:
      type: ClusterIP
      port: 8000
      targetPort: 8000
    port: 8000
    healthCheck:
      enabled: true
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 4Gi
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      CONFIG_FILE: configs/config_web_default_llamaindex.yml
      DASK_NWORKERS: '1'
      DASK_NTHREADS: '4'
      NAT_JOB_STORE_DB_URL: postgresql+asyncpg://$(DB_USER_NAME):$(DB_USER_PASSWORD)@aiq-postgres:5432/aiq_jobs
      AIQ_CHECKPOINT_DB: postgresql://$(DB_USER_NAME):$(DB_USER_PASSWORD)@aiq-postgres:5432/aiq_jobs
      AIQ_SUMMARY_DB: postgresql+asyncpg://$(DB_USER_NAME):$(DB_USER_PASSWORD)@aiq-postgres:5432/aiq_jobs
      RAG_SERVER_URL: http://rag-server:8080
      RAG_INGEST_URL: http://rag-ingest:8080
      COLLECTION_NAME: default_collection
      AIQ_CHROMA_DIR: /app/data/chroma
      MODE: web
    labels:
      component: backend
    route:
      enabled: true
      host: ""  # Leave empty for auto-generated OpenShift hostname
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      annotations: {}
    ingress:
      enabled: false
      annotations: {}
    volumes:
    - name: postgres-init
      configMap:
        name: aiq-postgres-init
    - name: config-override
      configMap:
        name: aiq-config-mlflow
    - name: data-storage
      emptyDir: {}
    volumeMounts:
    - name: data-storage
      mountPath: /app/data
    - name: config-override
      mountPath: /app/configs/config_web_default_llamaindex.yml
      subPath: config_web_default_llamaindex.yml
      readOnly: true
    initContainers:
    - name: db-init
      image: bitnami/postgresql:latest
      command:
      - sh
      - -c
      - "echo \"Waiting for postgres...\"\nuntil pg_isready -h aiq-postgres -U $(DB_USER_NAME)\
        \ -d aiq_jobs; do\n  sleep 2\ndone\necho \"Running init script...\"\npsql\
        \ -h aiq-postgres -U $(DB_USER_NAME) -d aiq_jobs -v db_user=$(DB_USER_NAME)\
        \ -f /db-init/init.sql\n"
      env:
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: aiq-credentials
            key: DB_USER_PASSWORD
      - name: DB_USER_NAME
        valueFrom:
          secretKeyRef:
            name: aiq-credentials
            key: DB_USER_NAME
      volumeMounts:
      - name: postgres-init
        mountPath: /db-init
        readOnly: true
    stdin: false
    tty: false
    podSecurityContext: null
    configMaps:
    - name: aiq-config-mlflow
      data:
        config_web_default_llamaindex.yml: |
          # This is the default configuration for the Web mode.
          # It has the following features:
          # - Knowledge retrieval using LlamaIndex
          # - Web search and Paper search tools by default

          general:
            use_uvloop: true
            telemetry:
              logging:
                console:
                  _type: console
                  level: INFO
              tracing:
                otel:
                  _type: otelcollector_redaction
                  endpoint: https://mlflow.redhat-ods-applications.svc.cluster.local:8443/v1/traces
                  headers:
                    x-mlflow-experiment-id: "1"
                  project: aiq-research
                  redaction_enabled: true
                  redaction_attributes:
                    - input.value
                    - output.value
                    - nat.metadata
                  force_redaction: false
                  redaction_tag: redacted

            front_end:
              _type: aiq_api
              runner_class: aiq_api.plugin.AIQAPIWorker
              # =========================================================================
              # Knowledge API is automatically enabled when knowledge_retrieval function
              # is configured
              # =========================================================================
              # Async Job API Settings
              # =========================================================================
              # Async job infrastructure database (NAT JobStore + EventStore)
              # Used by: /v1/jobs/async routes, SSE streaming, job status persistence
              # Requires async driver for SQLite (aiosqlite) or PostgreSQL (asyncpg)
              # Environment overrides:
              # - NAT_JOB_STORE_DB_URL (direct override)
              # - NAT_JOB_STORE_DB_URL_DEV / NAT_JOB_STORE_DB_URL_PROD (via NAT_ENV)
              db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
              # Job expiry - how long completed jobs stay in database before cleanup
              expiry_seconds: 86400  # 24 hours (min: 600, max: 604800/7 days)
              cors:
                allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
                allow_methods:
                  - GET
                  - POST
                  - DELETE
                  - OPTIONS
                allow_headers:
                  - "*"
                allow_credentials: true
                expose_headers:
                  - "*"

          llms:
            nemotron_llm_intent:
              _type: nim
              model_name: nvidia/nemotron-3-nano-30b-a3b
              base_url: "https://integrate.api.nvidia.com/v1"
              temperature: 0.5
              top_p: 0.9
              max_tokens: 4096
              num_retries: 5
              chat_template_kwargs:
                enable_thinking: true

            nemotron_nano_llm:
              _type: nim
              model_name: nvidia/nemotron-3-nano-30b-a3b
              base_url: "https://integrate.api.nvidia.com/v1"
              temperature: 0.1
              top_p: 0.3
              max_tokens: 16384
              num_retries: 5
              chat_template_kwargs:
                enable_thinking: true

            gpt_oss_llm:
              _type: nim
              model_name: openai/gpt-oss-120b
              base_url: https://integrate.api.nvidia.com/v1
              temperature: 1.0
              top_p: 1.0
              max_tokens: 256000
              api_key: ${NVIDIA_API_KEY}
              max_retries: 10

            # Nemotron Super is compatible and tested with AIQ but has limited availability
            # on the Build API due to high demand.
            # Uncomment nemotron_super_llm below if the endpoint is accessible.
            # nemotron_super_llm:
            #   _type: nim
            #   model_name: nvidia/nemotron-3-super-120b-a12b
            #   base_url: "https://integrate.api.nvidia.com/v1"
            #   temperature: 1.0
            #   top_p: 1.0
            #   max_tokens: 128000
            #   num_retries: 5
            #   chat_template_kwargs:
            #     enable_thinking: true

            # LLM for document summaries (required when generate_summary: true)
            summary_llm:
              _type: nim
              model_name: nvidia/nemotron-mini-4b-instruct
              base_url: "https://integrate.api.nvidia.com/v1"
              api_key: ${NVIDIA_API_KEY}
              temperature: 0.3
              max_tokens: 100

          functions:
            # =========================================================================
            # Data Source Registry
            # =========================================================================
            # Central registry that controls:
            #   1. UI toggles — each source appears as an on/off switch in the frontend
            #   2. Per-message filtering — users can select active sources per request
            #   3. Tool auto-inheritance — agents with no explicit `tools` list receive
            #      every tool listed here (use `exclude_tools` on agents to specialize)
            #
            # Adding a new tool or MCP function group? Just add it here — all agents
            # pick it up automatically. No per-agent config changes needed.
            #
            # Source entry fields:
            #   id            — Unique key used in API payloads and filtering
            #   name          — Display name shown in the UI
            #   description   — Human-readable description shown in the UI
            #   tools         — List of NAT function names or function group names
            #   requires_auth — (default: false) If true, the UI greys out this source
            #                   until the user signs in. Use for sources that need
            #                   user-level OAuth tokens (e.g., enterprise SSO).
            #                   Sources using backend API keys (Tavily, Serper) should
            #                   leave this false.
            #   default_enabled — (default: true) Whether enabled by default
            #
            # See docs/source/customization/tools-and-sources.md for full details.
            # =========================================================================
            data_sources:
              _type: data_source_registry
              sources:
                - id: web_search
                  name: "Web Search"
                  description: "Search the web for real-time information."
                  tools:
                    - web_search_tool
                    - advanced_web_search_tool
                - id: knowledge_layer
                  name: "Knowledge Base"
                  description: "Search uploaded documents and files."
                  tools:
                    - knowledge_search
                # Uncomment when paper_search_tool is enabled (requires SERPER_API_KEY)
                # - id: paper_search
                #   name: "Academic Papers"
                #   description: "Search academic papers and scientific publications."
                #   tools:
                #     - paper_search_tool

            web_search_tool:
              _type: tavily_web_search
              max_results: 5
              max_content_length: 1000

            advanced_web_search_tool:
              _type: tavily_web_search
              max_results: 2
              advanced_search: true

            # Knowledge Retrieval (see sources/knowledge_layer/KNOWLEDGE-LAYER-SETUP.md)
            knowledge_search:
              _type: knowledge_retrieval
              backend: llamaindex
              collection_name: ${COLLECTION_NAME:-test_collection}
              generate_summary: true
              summary_model: summary_llm                     # Required when generate_summary: true
              summary_db: ${AIQ_SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}
              top_k: 5
              chroma_dir: ${AIQ_CHROMA_DIR:-/tmp/chroma_data}

            # Paper Search (optional - requires SERPER_API_KEY)
            # Uncomment the block below and set SERPER_API_KEY to enable academic paper search.
            # paper_search_tool:
            #   _type: paper_search
            #   max_results: 5
            #   serper_api_key: ${SERPER_API_KEY}

            # =========================================================================
            # Agents
            # =========================================================================
            # Tool inheritance: agents with no `tools` list inherit ALL tools from the
            # data_source_registry above. Use `exclude_tools` to remove specific tools
            # from an agent (e.g., give shallow the basic search, deep the advanced).
            # To bypass auto-inherit entirely, set an explicit `tools` list.
            # =========================================================================
            intent_classifier:
              _type: intent_classifier
              llm: nemotron_llm_intent
              # tools: omitted -> inherits all from data_source_registry
              # exclude_tools: []
              verbose: true

            clarifier_agent:
              _type: clarifier_agent
              llm: nemotron_nano_llm  # replace with nemotron_super_llm if available
              planner_llm: nemotron_nano_llm  # replace with nemotron_super_llm if available
              # tools: omitted -> inherits all from data_source_registry
              # exclude_tools: []
              max_turns: 3
              enable_plan_approval: true
              log_response_max_chars: 2000
              verbose: true

            shallow_research_agent:
              _type: shallow_research_agent
              llm: nemotron_nano_llm
              # tools: omitted -> inherits all from data_source_registry
              exclude_tools:                     # Remove advanced variant; shallow uses web_search_tool
                - advanced_web_search_tool
              verbose: true
              max_llm_turns: 10
              max_tool_iterations: 5

            deep_research_agent:
              _type: deep_research_agent
              orchestrator_llm: gpt_oss_llm
              researcher_llm: nemotron_nano_llm  # replace with nemotron_super_llm if available
              planner_llm: gpt_oss_llm
              # tools: omitted -> inherits all from data_source_registry
              exclude_tools:                     # Remove basic variant; deep uses advanced_web_search_tool
                - web_search_tool
              max_loops: 2
              verbose: true

          workflow:
            _type: chat_deepresearcher_agent
            verbose: true
            enable_escalation: true
            enable_clarifier: true
            use_async_deep_research: true
            checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
  postgres:
    enabled: true
    replicas: 1
    image:
      repository: bitnami/postgresql
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      ports:
      - name: postgres
        port: 5432
        targetPort: 5432
    ports:
    - name: postgres
      containerPort: 5432
      protocol: TCP
    secretEnv:
      POSTGRES_USER: DB_USER_NAME
      POSTGRES_PASSWORD: DB_USER_PASSWORD
    env:
      POSTGRES_DB: aiq_jobs
    configMaps:
    - name: aiq-postgres-init
      data:
        init.sql: "-- =============================================================================\n\
          -- AI-Q - Database Initialization\n-- This script runs on first PostgreSQL\
          \ startup (fresh volume only)\n-- =============================================================================\n\
          --\n-- What this script handles (requires admin privileges):\n--   - Creating\
          \ databases (aiq_checkpoints)\n--   - Granting permissions\n--   - Creating\
          \ NAT JobStore table (job_info)\n--   - Creating performance indices\n\
          --\n-- What the app handles automatically:\n--   - job_events table (event_store.py\
          \ creates via SQLAlchemy)\n--   - LangGraph checkpoint tables (AsyncPostgresSaver\
          \ creates them)\n--   - summaries table (summary_store.py creates if not\
          \ exists)\n--\n-- =============================================================================\n\
          \n-- Create checkpoints database for LangGraph agent state\nCREATE DATABASE\
          \ aiq_checkpoints;\n\n-- Grant permissions\nGRANT ALL PRIVILEGES ON DATABASE\
          \ aiq_jobs TO :\"db_user\";\nGRANT ALL PRIVILEGES ON DATABASE aiq_checkpoints\
          \ TO :\"db_user\";\n\n-- =============================================================================\n\
          -- Create job store table in aiq_jobs database\n-- Note: job_events table\
          \ is created by the app (event_store.py)\n-- =============================================================================\n\
          \\connect aiq_jobs\n\n-- Job metadata table (NAT JobStore - not auto-created\
          \ by NAT)\nCREATE TABLE IF NOT EXISTS job_info (\n    job_id VARCHAR PRIMARY\
          \ KEY,\n    status VARCHAR NOT NULL,\n    config_file VARCHAR,\n    error\
          \ VARCHAR,\n    output_path VARCHAR,\n    created_at TIMESTAMP WITH TIME\
          \ ZONE,\n    updated_at TIMESTAMP WITH TIME ZONE,\n    expiry_seconds\
          \ INTEGER,\n    output VARCHAR,\n    is_expired BOOLEAN DEFAULT FALSE\n\
          );\n\n-- Performance indices\nCREATE INDEX IF NOT EXISTS idx_job_info_status\
          \ ON job_info(status);\nCREATE INDEX IF NOT EXISTS idx_job_info_created_at\
          \ ON job_info(created_at);\n"
    persistence:
    - name: aiq-postgres-data
      accessModes:
      - ReadWriteOnce
      size: 10Gi
    volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: aiq-postgres-data
    volumeMounts:
    - name: postgres-data
      mountPath: /var/lib/postgresql/data
    healthCheck:
      enabled: true
      livenessProbe:
        exec:
          command:
          - sh
          - -c
          - pg_isready -U $POSTGRES_USER -d aiq_jobs
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 5
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - pg_isready -U $POSTGRES_USER -d aiq_jobs
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 5
    labels:
      component: postgres
    podSecurityContext: null
  frontend:
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    image:
      repository: quay.io/tasmith/aiq-frontend-redhat
      tag: "2.1.0"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ngc-api
    service:
      type: ClusterIP
      port: 3000
      targetPort: 3000
    port: 3000
    healthCheck:
      enabled: true
      path: /
      startupProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 30
      readinessProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 2Gi
    env:
      BACKEND_URL: http://aiq-backend:8000
      NODE_ENV: production
      REQUIRE_AUTH: 'false'
      FILE_UPLOAD_ACCEPTED_TYPES: .pdf,.docx,.txt,.md
      FILE_UPLOAD_MAX_SIZE_MB: '100'
      FILE_UPLOAD_MAX_FILE_COUNT: '10'
      FILE_EXPIRATION_CHECK_INTERVAL_HOURS: '0'
      NEXT_PUBLIC_DATADOG_ENABLED: 'false'
      
      # Red Hat UI Branding - Metadata
      # Note: Override these with values-branding.yaml for custom deployments
      NEXT_PUBLIC_APP_TITLE: "Red Hat Research"
      NEXT_PUBLIC_APP_DESCRIPTION: "Red Hat AI-powered research assistant"
      NEXT_PUBLIC_FONTS_URL: "https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap"
    labels:
      component: frontend
    route:
      enabled: true
      host: ""  # Leave empty for auto-generated OpenShift hostname
      annotations: {}
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    enabled: true
    ingress:
      enabled: false  # Disabled in favor of OpenShift Route
      className: nginx
      annotations: {}
    podSecurityContext: null
secretEnvAsEnv: false
