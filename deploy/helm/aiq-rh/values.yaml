# Generated WEB mode deployment

appname: aiq
project:
  name: aiq
  deploymentEnv: ''
  cluster_name: in-cluster
  cloud_provider: kind
  primary_owner: developer@localhost
  secondary_owner: developer@localhost
  blueprint_type: web
  deploymentTarget: kubernetes
  orientation: external
  profile: web
  services:
  - backend
  - frontend
  - postgres
  - rag
sharedSecrets:
  enabled: true
  autoMount: true
  refreshInterval: 5m
  dataFrom: []
apps:
  backend:
    enabled: true
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    image:
      repository: quay.io/tasmith/aiq-backend-redhat
      tag: "v2.1.0-nv"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ngc-api
    service:
      type: ClusterIP
      port: 8000
      targetPort: 8000
    port: 8000
    healthCheck:
      enabled: true
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 4Gi
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      CONFIG_FILE: configs/config_web_default_llamaindex.yml
      DASK_NWORKERS: '1'
      DASK_NTHREADS: '4'
      NAT_JOB_STORE_DB_URL: postgresql+asyncpg://$(DB_USER_NAME):$(DB_USER_PASSWORD)@aiq-postgres:5432/aiq_jobs
      AIQ_CHECKPOINT_DB: postgresql://$(DB_USER_NAME):$(DB_USER_PASSWORD)@aiq-postgres:5432/aiq_jobs
      AIQ_SUMMARY_DB: postgresql+asyncpg://$(DB_USER_NAME):$(DB_USER_PASSWORD)@aiq-postgres:5432/aiq_jobs
      RAG_SERVER_URL: http://rag-server:8080
      RAG_INGEST_URL: http://rag-ingest:8080
      COLLECTION_NAME: default_collection
      AIQ_CHROMA_DIR: /app/data/chroma
      MODE: web
    labels:
      component: backend
    route:
      enabled: true
      host: ""  # Leave empty for auto-generated OpenShift hostname
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      annotations: {}
    ingress:
      enabled: false
      annotations: {}
    volumes:
    - name: postgres-init
      configMap:
        name: aiq-postgres-init
    - name: data-storage
      emptyDir: {}
    volumeMounts:
    - name: data-storage
      mountPath: /app/data
    initContainers:
    - name: db-init
      image: bitnami/postgresql:latest
      command:
      - sh
      - -c
      - "echo \"Waiting for postgres...\"\nuntil pg_isready -h aiq-postgres -U $(DB_USER_NAME)\
        \ -d aiq_jobs; do\n  sleep 2\ndone\necho \"Running init script...\"\npsql\
        \ -h aiq-postgres -U $(DB_USER_NAME) -d aiq_jobs -v db_user=$(DB_USER_NAME)\
        \ -f /db-init/init.sql\n"
      env:
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: aiq-credentials
            key: DB_USER_PASSWORD
      - name: DB_USER_NAME
        valueFrom:
          secretKeyRef:
            name: aiq-credentials
            key: DB_USER_NAME
      volumeMounts:
      - name: postgres-init
        mountPath: /db-init
        readOnly: true
    stdin: false
    tty: false
    podSecurityContext: null
  postgres:
    enabled: true
    replicas: 1
    image:
      repository: bitnami/postgresql
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      ports:
      - name: postgres
        port: 5432
        targetPort: 5432
    ports:
    - name: postgres
      containerPort: 5432
      protocol: TCP
    secretEnv:
      POSTGRES_USER: DB_USER_NAME
      POSTGRES_PASSWORD: DB_USER_PASSWORD
    env:
      POSTGRES_DB: aiq_jobs
    configMaps:
    - name: aiq-postgres-init
      data:
        init.sql: "-- =============================================================================\n\
          -- AI-Q - Database Initialization\n-- This script runs on first PostgreSQL\
          \ startup (fresh volume only)\n-- =============================================================================\n\
          --\n-- What this script handles (requires admin privileges):\n--   - Creating\
          \ databases (aiq_checkpoints)\n--   - Granting permissions\n--   - Creating\
          \ NAT JobStore table (job_info)\n--   - Creating performance indices\n\
          --\n-- What the app handles automatically:\n--   - job_events table (event_store.py\
          \ creates via SQLAlchemy)\n--   - LangGraph checkpoint tables (AsyncPostgresSaver\
          \ creates them)\n--   - summaries table (summary_store.py creates if not\
          \ exists)\n--\n-- =============================================================================\n\
          \n-- Create checkpoints database for LangGraph agent state\nCREATE DATABASE\
          \ aiq_checkpoints;\n\n-- Grant permissions\nGRANT ALL PRIVILEGES ON DATABASE\
          \ aiq_jobs TO :\"db_user\";\nGRANT ALL PRIVILEGES ON DATABASE aiq_checkpoints\
          \ TO :\"db_user\";\n\n-- =============================================================================\n\
          -- Create job store table in aiq_jobs database\n-- Note: job_events table\
          \ is created by the app (event_store.py)\n-- =============================================================================\n\
          \\connect aiq_jobs\n\n-- Job metadata table (NAT JobStore - not auto-created\
          \ by NAT)\nCREATE TABLE IF NOT EXISTS job_info (\n    job_id VARCHAR PRIMARY\
          \ KEY,\n    status VARCHAR NOT NULL,\n    config_file VARCHAR,\n    error\
          \ VARCHAR,\n    output_path VARCHAR,\n    created_at TIMESTAMP WITH TIME\
          \ ZONE,\n    updated_at TIMESTAMP WITH TIME ZONE,\n    expiry_seconds\
          \ INTEGER,\n    output VARCHAR,\n    is_expired BOOLEAN DEFAULT FALSE\n\
          );\n\n-- Performance indices\nCREATE INDEX IF NOT EXISTS idx_job_info_status\
          \ ON job_info(status);\nCREATE INDEX IF NOT EXISTS idx_job_info_created_at\
          \ ON job_info(created_at);\n"
    persistence:
    - name: aiq-postgres-data
      accessModes:
      - ReadWriteOnce
      size: 10Gi
    volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: aiq-postgres-data
    volumeMounts:
    - name: postgres-data
      mountPath: /var/lib/postgresql/data
    healthCheck:
      enabled: true
      livenessProbe:
        exec:
          command:
          - sh
          - -c
          - pg_isready -U $POSTGRES_USER -d aiq_jobs
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 5
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - pg_isready -U $POSTGRES_USER -d aiq_jobs
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 5
    labels:
      component: postgres
    podSecurityContext: null
  frontend:
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    image:
      repository: quay.io/tasmith/aiq-frontend-redhat
      tag: "v2.1.0-nv"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ngc-api
    service:
      type: ClusterIP
      port: 3000
      targetPort: 3000
    port: 3000
    healthCheck:
      enabled: true
      path: /
      startupProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 30
      readinessProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 2Gi
    env:
      BACKEND_URL: http://aiq-backend:8000
      NODE_ENV: production
      REQUIRE_AUTH: 'false'
      FILE_UPLOAD_ACCEPTED_TYPES: .pdf,.docx,.txt,.md
      FILE_UPLOAD_MAX_SIZE_MB: '100'
      FILE_UPLOAD_MAX_FILE_COUNT: '10'
      FILE_EXPIRATION_CHECK_INTERVAL_HOURS: '0'
      NEXT_PUBLIC_DATADOG_ENABLED: 'false'
      
      # Red Hat UI Branding
      NEXT_PUBLIC_APP_TITLE: "Red Hat Research"
      NEXT_PUBLIC_APP_DESCRIPTION: "Red Hat AI-powered research assistant"
      NEXT_PUBLIC_FAVICON_PATH: "/favicon.svg"
      NEXT_PUBLIC_FONTS_URL: "https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap"
      NEXT_PUBLIC_BRAND_NAME: "Red Hat"
      NEXT_PUBLIC_BRAND_COLOR: "#EE0000"
      NEXT_PUBLIC_LOGO_SVG_PATH: "M341.5 261.1c-1.1-3.6-3.2-7-6.2-9.7l-2.6-2.3c-5.8-5-13.3-7.7-21-7.7h-16.4c-1.4 0-2.7.3-3.9.8l-35.7 15.3c-3.1 1.3-5.1 4.3-5.1 7.7v7.9c0 3.3 2 6.3 5.1 7.6l11.5 4.9c3.1 1.3 5.1 4.3 5.1 7.6v18.6c0 4.6-3.7 8.3-8.3 8.3H196c-4.6 0-8.3 3.7-8.3 8.3v16.6c0 4.6 3.7 8.3 8.3 8.3h67.5c29.8 0 54-24.2 54-54v-9.8c0-2.5-1.1-4.9-3.1-6.5l-9.2-7.6c-1.9-1.6-3.1-3.9-3.1-6.5v-.5c0-2.8 1.4-5.3 3.7-6.8l4.5-2.9c2.3-1.5 3.7-4.1 3.7-6.8v-2.2c0-1.3-.2-2.7-.5-3.8zM459.4 187.5c-25.7-3.3-50.9 2.8-71.4 17.3l-14 9.9c-8.5 6-18.5 9.2-28.8 9.2h-39.9c-6.3 0-12.3 1.5-17.8 4.3l-50.9 25.8c-9.2 4.7-15.1 14.1-15.1 24.5v14.1c0 9.4 4.8 18.2 12.7 23.3l23.7 15.2c2.6 1.7 4.2 4.6 4.2 7.7v30.4c0 15 12.2 27.2 27.2 27.2h30.1c44.7 0 81-36.3 81-81v-13.5c0-3.6-1.7-7-4.5-9.2l-14.6-11.3c-2.8-2.2-4.5-5.6-4.5-9.2v-4.2c0-4.1 2.1-7.9 5.6-10.1l14.7-9.4c5.5-3.5 8.8-9.5 8.8-16v-4.3c0-3.2-.6-6.3-1.8-9.2-2.1-5.2-3.5-10.8-3.8-16.5-.3-4.6 3.7-8.5 8.3-7.9 7.8 1.1 15.4 3.6 22.3 7.6 8.2 4.7 17.7 6.2 27 4.2l.6-.1c8-1.7 14.9-6.7 18.9-13.7 4-7 4.7-15.2 2-22.7-3.2-8.8-10.7-15.1-19.9-16.4z"
      NEXT_PUBLIC_LOGO_VIEWBOX: "0 0 512 512"
      NEXT_PUBLIC_DOCS_URL: "https://www.redhat.com/en/blog/introducing-ai-quickstarts"
      NEXT_PUBLIC_SIGNIN_BUTTON_CLASS: "bg-[#EE0000] hover:bg-[#CC0000]"
    labels:
      component: frontend
    route:
      enabled: true
      host: ""  # Leave empty for auto-generated OpenShift hostname
      annotations: {}
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    enabled: true
    ingress:
      enabled: false  # Disabled in favor of OpenShift Route
      className: nginx
      annotations: {}
    podSecurityContext: null
secretEnvAsEnv: false
