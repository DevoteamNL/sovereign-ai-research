# AI-Q Helm Values - NGC + Foundational RAG Configuration
#
# This configuration uses:
# - NGC API models for all LLM inference (AI-Q agents)
# - External NVIDIA RAG Blueprint for knowledge retrieval
#
# Prerequisites:
# - NVIDIA API key (for NGC models)
# - NVIDIA RAG Blueprint deployed and accessible
# - Know your RAG server URLs (query and ingestion endpoints)
#
# Usage:
#   helm upgrade --install aiq aiq-rh/ -n ns-aiq \
#     -f aiq-rh/values-frag.yaml

apps:
  backend:
    env:
      CONFIG_FILE: /app/configs-custom/config_web_frag.yml

      # REQUIRED: Update these to your RAG Blueprint endpoints
      # If RAG is in the same cluster, use internal service DNS:
      # http://rag-server.<rag-namespace>.svc.cluster.local:8081/v1
      RAG_SERVER_URL: http://rag-server.rag.svc.cluster.local:8081/v1
      RAG_INGEST_URL: http://ingestor-server.rag.svc.cluster.local:8082/v1

      # Optional: Collection name for document storage
      # COLLECTION_NAME: default_collection

      # OpenTelemetry certificate for HTTPS MLflow connection
      OTEL_EXPORTER_OTLP_CERTIFICATE: /etc/ssl/certs/openshift-service-ca.crt

    # Mount custom NGC+RAG config file and data storage
    volumeMounts:
    - name: frag-config
      mountPath: /app/configs-custom
      readOnly: true
    - name: data-storage
      mountPath: /app/data
    - name: service-ca
      mountPath: /etc/ssl/certs/openshift-service-ca.crt
      subPath: service-ca.crt
      readOnly: true

    volumes:
    - name: postgres-init
      configMap:
        name: aiq-postgres-init
    - name: frag-config
      configMap:
        name: aiq-frag-config
    - name: service-ca
      configMap:
        name: openshift-service-ca.crt
    - name: data-storage
      emptyDir: {}

    # Create ConfigMap with NGC+RAG config file
    configMaps:
    - name: aiq-frag-config
      data:
        config_web_frag.yml: |
          general:
            use_uvloop: true
            telemetry:
              logging:
                console:
                  _type: console
                  level: INFO
              tracing:
                otel:
                  _type: otelcollector_redaction
                  endpoint: https://mlflow.redhat-ods-applications.svc.cluster.local:8443/v1/traces
                  headers:
                    x-mlflow-experiment-id: "1"
                    x-mlflow-workspace: "ns-aiq"
                    Authorization: "Bearer {YOUR_TOKEN_HERE}"
                  project: aiq-research
                  redaction_enabled: true
                  redaction_attributes:
                    - input.value
                    - output.value
                    - nat.metadata
                  force_redaction: false
                  redaction_tag: redacted
            front_end:
              _type: aiq_api
              runner_class: aiq_api.plugin.AIQAPIWorker
              db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
              expiry_seconds: 86400
              cors:
                allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
                allow_methods:
                  - GET
                  - POST
                  - DELETE
                  - OPTIONS
                allow_headers:
                  - "*"
                allow_credentials: true
                expose_headers:
                  - "*"
          llms:
            nemotron_llm_intent:
              _type: nim
              model_name: nvidia/nemotron-3-nano-30b-a3b
              base_url: "https://integrate.api.nvidia.com/v1"
              temperature: 0.5
              top_p: 0.9
              max_tokens: 4096
              num_retries: 5
              chat_template_kwargs:
                enable_thinking: true
            nemotron_nano_llm:
              _type: nim
              model_name: nvidia/nemotron-3-nano-30b-a3b
              base_url: "https://integrate.api.nvidia.com/v1"
              temperature: 0.1
              top_p: 0.3
              max_tokens: 16384
              num_retries: 5
              chat_template_kwargs:
                enable_thinking: true
            gpt_oss_llm:
              _type: nim
              model_name: openai/gpt-oss-120b
              base_url: https://integrate.api.nvidia.com/v1
              temperature: 1.0
              top_p: 1.0
              max_tokens: 256000
              api_key: ${NVIDIA_API_KEY}
              max_retries: 10
          functions:
            # =========================================================================
            # Data Source Registry
            # =========================================================================
            # Central registry that controls UI toggles and tool auto-inheritance
            # =========================================================================
            data_sources:
              _type: data_source_registry
              sources:
                - id: web_search
                  name: "Web Search"
                  description: "Search the web for real-time information."
                  tools:
                    - web_search_tool
                    - advanced_web_search_tool
                - id: knowledge_layer
                  name: "Knowledge Base"
                  description: "Search uploaded documents and files."
                  tools:
                    - knowledge_search
                - id: paper_search
                  name: "Academic Papers"
                  description: "Search academic papers and scientific publications."
                  tools:
                    - paper_search_tool

            web_search_tool:
              _type: tavily_web_search
              max_results: 5
              max_content_length: 1000

            advanced_web_search_tool:
              _type: tavily_web_search
              max_results: 2
              advanced_search: true

            knowledge_search:
              _type: knowledge_retrieval
              backend: foundational_rag
              collection_name: ${COLLECTION_NAME:-default_collection}
              summary_db: ${AIQ_SUMMARY_DB:-postgresql+asyncpg://postgres:postgres@aiq-postgres:5432/aiq_jobs}
              top_k: 5
              rag_url: ${RAG_SERVER_URL:-http://rag-server.rag.svc.cluster.local:8081/v1}
              ingest_url: ${RAG_INGEST_URL:-http://ingestor-server.rag.svc.cluster.local:8082/v1}
              timeout: 300

            paper_search_tool:
              _type: paper_search
              max_results: 5
              serper_api_key: ${SERPER_API_KEY}

            # =========================================================================
            # Agents
            # =========================================================================
            # Tool inheritance: agents with no `tools` list inherit ALL tools from the
            # data_source_registry above. Use `exclude_tools` to remove specific tools.
            # =========================================================================
            intent_classifier:
              _type: intent_classifier
              llm: nemotron_llm_intent
              # tools: omitted -> inherits all from data_source_registry
              verbose: true

            clarifier_agent:
              _type: clarifier_agent
              llm: nemotron_nano_llm
              planner_llm: nemotron_nano_llm
              # tools: omitted -> inherits all from data_source_registry
              max_turns: 3
              enable_plan_approval: true
              log_response_max_chars: 2000
              verbose: true

            shallow_research_agent:
              _type: shallow_research_agent
              llm: nemotron_nano_llm
              # tools: omitted -> inherits all from data_source_registry
              exclude_tools:
                - advanced_web_search_tool  # Remove advanced variant; shallow uses web_search_tool
              verbose: true
              max_llm_turns: 10
              max_tool_iterations: 5

            deep_research_agent:
              _type: deep_research_agent
              orchestrator_llm: gpt_oss_llm
              researcher_llm: nemotron_nano_llm
              planner_llm: gpt_oss_llm
              # tools: omitted -> inherits all from data_source_registry
              exclude_tools:
                - web_search_tool  # Remove basic variant; deep uses advanced_web_search_tool
              max_loops: 2
              verbose: true
          workflow:
            _type: chat_deepresearcher_agent
            enable_escalation: true
            enable_clarifier: true
            use_async_deep_research: true
            checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}

    imagePullSecrets:
      - name: ngc-api

  frontend:
    imagePullSecrets:
      - name: ngc-api
