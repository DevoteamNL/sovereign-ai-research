# vLLM + Foundational RAG Configuration for Web mode.
#
# Uses OpenAI-compatible endpoints served by vLLM for LLM inference
# AND connects to external NVIDIA RAG Blueprint for knowledge retrieval.
#
# Set VLLM_BASE_URL to your vLLM server (default: http://localhost:8000).
# Set RAG_SERVER_URL to your RAG Blueprint query endpoint.
# Set RAG_INGEST_URL to your RAG Blueprint ingestion endpoint.
#
# Features:
# - All LLM inference via vLLM (local models)
# - Knowledge retrieval using Foundational RAG (external RAG Blueprint)
# - Web search and Paper search tools by default

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  # Intent classification
  # Defaults to VLLM_BASE_URL (same endpoint as other roles). Only set
  # VLLM_INTENT_BASE_URL when running a mixed-model setup where intent
  # classification is served by a separate vLLM instance from the other LLMs.
  intent_llm:
    _type: openai
    model_name: ${VLLM_INTENT_MODEL:-RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8}
    base_url: ${VLLM_INTENT_BASE_URL:-${VLLM_BASE_URL:-http://localhost:8000}}/v1
    api_key: ${VLLM_API_KEY}
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096

  # Shallow research and general agent work
  researcher_llm:
    _type: openai
    model_name: ${VLLM_RESEARCHER_MODEL:-RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8}
    base_url: ${VLLM_BASE_URL:-http://localhost:8000}/v1
    api_key: ${VLLM_API_KEY}
    temperature: 0.1
    top_p: 0.3
    max_tokens: 16384

  # Deep research orchestrator and planner — large context model
  # Default: RedHatAI/gpt-oss-120b (120B, ~80GB VRAM quantized)
  # GPU-constrained alternative: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic (70B FP8, ~35-40GB VRAM)
  # Set VLLM_ORCHESTRATOR_BASE_URL when orchestrator runs on separate vLLM instance
  orchestrator_llm:
    _type: openai
    model_name: ${VLLM_ORCHESTRATOR_MODEL:-RedHatAI/gpt-oss-120b}
    base_url: ${VLLM_ORCHESTRATOR_BASE_URL:-${VLLM_BASE_URL:-http://localhost:8000}}/v1
    api_key: ${VLLM_API_KEY}
    temperature: 1.0
    top_p: 1.0
    max_tokens: 65536

  # Document summarization — small, fast model
  # Set VLLM_SUMMARY_BASE_URL when summary model runs on separate vLLM instance
  summary_llm:
    _type: openai
    model_name: ${VLLM_SUMMARY_MODEL:-nvidia/Nemotron-Mini-4B-Instruct}
    base_url: ${VLLM_SUMMARY_BASE_URL:-${VLLM_BASE_URL:-http://localhost:8000}}/v1
    api_key: ${VLLM_API_KEY}
    temperature: 0.3
    max_tokens: 100

functions:
  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  paper_search_tool:
    _type: paper_search
    max_results: 5
    serper_api_key: ${SERPER_API_KEY}

  news_search_tool:
    _type: news_search
    max_results: 5
    serper_api_key: ${SERPER_API_KEY}

  # Knowledge Retrieval via Foundational RAG (external RAG Blueprint)
  knowledge_search:
    _type: knowledge_retrieval
    backend: foundational_rag
    collection_name: ${COLLECTION_NAME:-default_collection}
    top_k: 5
    rag_url: ${RAG_SERVER_URL:-http://rag-server.rag.svc.cluster.local:8081/v1}
    ingest_url: ${RAG_INGEST_URL:-http://ingestor-server.rag.svc.cluster.local:8082/v1}
    timeout: 300

  intent_classifier:
    _type: intent_classifier
    llm: intent_llm
    verbose: true
    tools:
      - web_search_tool
      - paper_search_tool
      - knowledge_search

  clarifier_agent:
    _type: clarifier_agent
    llm: researcher_llm
    planner_llm: researcher_llm
    tools:
      - web_search_tool
      - paper_search_tool
      - knowledge_search
    max_turns: 3
    enable_plan_approval: true
    log_response_max_chars: 2000
    verbose: true

  shallow_research_agent:
    _type: shallow_research_agent
    llm: researcher_llm
    verbose: true
    tools:
      - web_search_tool
      - paper_search_tool
      - knowledge_search
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: orchestrator_llm
    researcher_llm: researcher_llm
    planner_llm: orchestrator_llm
    max_loops: 2
    verbose: true
    tools:
      - paper_search_tool
      - advanced_web_search_tool
      - knowledge_search

workflow:
  _type: chat_deepresearcher_agent
  verbose: true
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
